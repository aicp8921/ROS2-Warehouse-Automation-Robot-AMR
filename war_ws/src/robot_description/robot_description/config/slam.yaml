slam_toolbox:
  ros__parameters:
    # --- Frame & Time Setup ---
    use_sim_time: true
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint

    # --- Mode ---
    mode: mapping # Set to 'localization' when navigating a saved map

    # --- Solver Settings ---
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # --- Map & Range Settings ---
    resolution: 0.05 # 5cm per pixel (Standard for indoor navigation)
    max_laser_range: 3.5 # Set this to match your physical LiDAR spec (e.g., 8.0 or 12.0)

    # --- Timing & Updates ---
    map_update_interval: 1.0 # Publish updated map every 1 second
    transform_publish_period: 0.02 # 50 Hz TF publishing rate (map -> odom)
    transform_timeout: 0.2

    # --- Processing Buffers ---
    throttle_scans: 1 # Process every scan (increase to 2 if CPU usage is high)
    scan_buffer_size: 20
    scan_queue_size: 10

    # --- Motion Filtering (Triggers scan processing) ---
    minimum_travel_distance: 0.10 # Process scan after moving 10cm
    minimum_travel_heading: 0.10 # Process scan after rotating ~5.7 degrees
    minimum_time_interval: 0.5 # Minimum time between scan insertions

    # --- Loop Closure ---
    do_loop_closing: true